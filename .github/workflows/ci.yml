# Continuous integration: typecheck, lint, unit + integration tests (real PostgreSQL), production build.
# Never deploys. (Browser and real-tunnel E2E suites run locally: see README "Scripts".)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: localians
          POSTGRES_PASSWORD: localians
          POSTGRES_DB: localians_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U localians" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway CI-only values (not secrets): the database above lives only for this job.
      TEST_DATABASE_URL: postgresql://localians:localians@localhost:5432/localians_test
      DATABASE_URL: postgresql://localians:localians@localhost:5432/localians_test
      BETTER_AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-else-0123
      BETTER_AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_SITE_URL: http://localhost:3001
      EMAIL_TRANSPORT: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The root tests import the VS Code extension's sources, which need its own dev dependencies (@types/vscode).
      - run: npm ci --prefix extensions/vscode --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run tunnel:build
      - run: npm run vscode:typecheck
      - run: npm run vscode:package

  # The published `localians` CLI: pack it exactly as `npm publish` would, install the tarball in an empty folder and
  # run it, on every supported OS and Node.js version. Never publishes.
  cli-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run cli:release
      - name: Pack (runs the prepack package check)
        run: mkdir -p "$RUNNER_TEMP/pack" && cd tunnel/cli && npm pack --pack-destination "$RUNNER_TEMP/pack"
      - name: Install the tarball in an empty folder and run it
        env:
          NO_COLOR: "1"
          LOCALIANS_CONFIG_DIR: ${{ runner.temp }}/localians-config
        run: |
          set -u
          app="$RUNNER_TEMP/clean-app" && mkdir -p "$app" && cd "$app" && echo '{}' > package.json
          npm install --no-audit --no-fund "$RUNNER_TEMP/pack/localians-0.1.0.tgz"
          test "$(npx --no-install localians --version)" = "0.1.0"
          npx --no-install localians --help | grep -q "npx localians share 3000"
          if [ "$RUNNER_OS" != "Windows" ]; then test -x "$(readlink -f node_modules/.bin/localians)"; fi
          set +e
          npx --no-install localians status; test $? -eq 3 || exit 1     # not logged in
          npx --no-install localians share 1; test $? -eq 4 || exit 1    # nothing running there
          npx --no-install localians share abc; test $? -eq 2 || exit 1  # usage error
          set -e
          test -z "$(ls -A "$LOCALIANS_CONFIG_DIR" 2>/dev/null)"         # nothing written without a login
